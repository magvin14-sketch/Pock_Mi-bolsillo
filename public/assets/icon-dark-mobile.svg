<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Coin Gradient -->
    <radialGradient id="coinGradient-dark-mobile" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow-dark-mobile" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Coin Glow -->
    <filter id="coinShine-dark-mobile" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#35D0BA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Card Background -->
  <rect
    x="25.6"
    y="25.6"
    width="460.8"
    height="460.8"
    rx="122.88"
    fill="#092224"
    stroke="#14B8A6"
    stroke-width="2.56"
    stroke-opacity="0.25"
    filter="url(#cardShadow-dark-mobile)"
  />

  <!-- Graphic Center Group -->
  <g transform="translate(256, 248) scale(1.12) translate(-256, -256)">
    
    <!-- ==================== COIN & SHINE ==================== -->
    <g id="coin-group">
      <!-- Shine Rays top right of coin -->
      <line
        x1="324" y1="126"
        x2="338" y2="112"
        stroke="#35D0BA"
        stroke-width="7"
        stroke-linecap="round"
      />
      <line
        x1="344" y1="148"
        x2="358" y2="134"
        stroke="#35D0BA"
        stroke-width="7"
        stroke-linecap="round"
      />

      <!-- Colón Coin Body -->
      <circle
        cx="256"
        cy="176"
        r="56"
        fill="url(#coinGradient-dark-mobile)"
        stroke="#06423E"
        stroke-width="7"
      />

      <!-- Coin Inner Groove -->
      <circle
        cx="256"
        cy="176"
        r="47"
        fill="none"
        stroke="#FDE047"
        stroke-width="1.8"
        stroke-opacity="0.8"
      />

      <!-- Costa Rican Colón '₡' Symbol -->
      <!-- Capital C curve with vertical stroke -->
      <path
        d="M 272 159 C 242 159, 234 170, 234 176 C 234 182, 242 193, 272 193"
        fill="none"
        stroke="#063834"
        stroke-width="7.5"
        stroke-linecap="round"
      />
      <!-- Colón vertical bisecting stroke -->
      <line
        x1="256"
        y1="150"
        x2="256"
        y2="202"
        stroke="#063834"
        stroke-width="6.5"
        stroke-linecap="round"
      />
    </g>

    <!-- ==================== POCKET ==================== -->
    <g id="pocket-group">
      <!-- Pocket Pouch Body -->
      <path
        d="M 160 206 
           L 352 206 
           L 346 304 
           C 342 354, 298 386, 256 394 
           C 214 386, 170 354, 166 304 
           Z"
        fill="#043A37"
        stroke="#00BFA5"
        stroke-width="11"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- Pocket Top Folded Cuff / Hem -->
      <rect
        x="154"
        y="196"
        width="204"
        height="22"
        rx="10"
        fill="#00BFA5"
      />

      <!-- U-Shaped Dashed Stitching Line -->
      <path
        d="M 180 232 
           L 180 300 
           C 183 340, 218 368, 256 374 
           C 294 368, 329 340, 332 300 
           L 332 232"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-dasharray="8 6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- ==================== WORDMARK ==================== -->
    <text
      x="256"
      y="432"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="34"
      font-weight="800"
      letter-spacing="-0.5"
      fill="#FFFFFF"
    >Pock</text>

    <text
      x="256"
      y="456"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="16"
      font-weight="500"
      letter-spacing="0.2"
      fill="#5EEAD4"
    >Mi bolsillo</text>
  </g>
</svg>